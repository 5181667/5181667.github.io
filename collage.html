<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼图工坊 | 在线图片拼接工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="collage-css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="top-bar">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                <span class="logo-text">拼图工坊</span>
            </div>
            <div class="top-actions">
                <button class="btn btn-ghost" id="btnNewProject">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    <span>新建项目</span>
                </button>
                <button class="btn btn-primary" id="btnExport">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                    </svg>
                    <span>导出图片</span>
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- 左侧工具栏 -->
            <aside class="sidebar sidebar-left">
                <div class="sidebar-section">
                    <h3 class="section-title">布局模式</h3>
                    <div class="layout-modes">
                        <button class="layout-btn active" data-layout="grid" title="网格布局">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"/>
                                <rect x="14" y="3" width="7" height="7"/>
                                <rect x="3" y="14" width="7" height="7"/>
                                <rect x="14" y="14" width="7" height="7"/>
                            </svg>
                            <span>网格</span>
                        </button>
                        <button class="layout-btn" data-layout="horizontal" title="水平拼接">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="6" width="6" height="12"/>
                                <rect x="9" y="6" width="6" height="12"/>
                                <rect x="16" y="6" width="6" height="12"/>
                            </svg>
                            <span>水平</span>
                        </button>
                        <button class="layout-btn" data-layout="vertical" title="垂直拼接">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="6" y="2" width="12" height="6"/>
                                <rect x="6" y="9" width="12" height="6"/>
                                <rect x="6" y="16" width="12" height="6"/>
                            </svg>
                            <span>垂直</span>
                        </button>
                        <button class="layout-btn" data-layout="free" title="自由布局">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="2" width="8" height="6" rx="1"/>
                                <rect x="12" y="4" width="10" height="8" rx="1"/>
                                <rect x="4" y="10" width="7" height="12" rx="1"/>
                                <rect x="14" y="14" width="8" height="8" rx="1"/>
                            </svg>
                            <span>自由</span>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section" id="gridSettingsSection">
                    <h3 class="section-title">网格设置</h3>
                    <div class="grid-presets" id="gridPresets">
                        <button class="preset-btn active" data-cols="2" data-rows="2">2×2</button>
                        <button class="preset-btn" data-cols="3" data-rows="2">3×2</button>
                        <button class="preset-btn" data-cols="2" data-rows="3">2×3</button>
                        <button class="preset-btn" data-cols="3" data-rows="3">3×3</button>
                        <button class="preset-btn" data-cols="4" data-rows="3">4×3</button>
                        <button class="preset-btn" data-cols="4" data-rows="4">4×4</button>
                    </div>
                    <div class="custom-grid">
                        <label class="small-label">自定义网格</label>
                        <div class="grid-inputs">
                            <input type="number" id="customCols" class="grid-input" value="2" min="1" max="10" title="列数">
                            <span class="grid-separator">×</span>
                            <input type="number" id="customRows" class="grid-input" value="2" min="1" max="10" title="行数">
                        </div>
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <h3 class="section-title">相纸/画布尺寸</h3>
                    <div class="control-group">
                        <select id="paperSize" class="select-input">
                            <option value="custom">自定义尺寸</option>
                            <optgroup label="证件照尺寸">
                                <option value="1inch">1寸 (25×35mm)</option>
                                <option value="2inch">2寸 (35×49mm)</option>
                            </optgroup>
                            <optgroup label="照片尺寸">
                                <option value="3inch">3寸 (55×84mm)</option>
                                <option value="4inch">4寸 (76×102mm)</option>
                                <option value="5inch">5寸 (89×127mm)</option>
                                <option value="6inch">6寸 (102×152mm)</option>
                                <option value="7inch">7寸 (127×178mm)</option>
                                <option value="8inch">8寸 (152×203mm)</option>
                            </optgroup>
                            <optgroup label="国际标准">
                                <option value="4x6">4×6英寸</option>
                                <option value="5x7">5×7英寸</option>
                                <option value="a4">A4 (210×297mm)</option>
                                <option value="a5">A5 (148×210mm)</option>
                            </optgroup>
                            <optgroup label="社交媒体">
                                <option value="square">正方形 (800×800)</option>
                                <option value="instagram">Instagram (1080×1080)</option>
                                <option value="story">Story (1080×1920)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="control-group" id="customSizeGroup">
                        <label class="small-label">自定义尺寸 (像素)</label>
                        <div class="size-inputs compact">
                            <input type="number" id="customWidth" class="size-input" value="800" min="100" max="5000" placeholder="宽">
                            <span class="size-separator">×</span>
                            <input type="number" id="customHeight" class="size-input" value="800" min="100" max="5000" placeholder="高">
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="section-title">画布设置</h3>
                    <div class="control-group">
                        <label>间距</label>
                        <div class="range-control">
                            <input type="range" id="gapSize" min="0" max="50" value="10">
                            <span class="range-value" id="gapValue">10px</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>圆角</label>
                        <div class="range-control">
                            <input type="range" id="borderRadius" min="0" max="30" value="8">
                            <span class="range-value" id="radiusValue">8px</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>背景色</label>
                        <div class="color-picker-wrap">
                            <input type="color" id="bgColor" value="#f8fafc">
                            <span class="color-value" id="bgColorValue">#f8fafc</span>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="section-title">图片列表</h3>
                    <div class="upload-zone" id="uploadZone">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="17,8 12,3 7,8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <p>拖拽图片到此处<br>或点击上传</p>
                        <input type="file" id="fileInput" multiple accept="image/*" hidden>
                    </div>
                    <div class="image-list" id="imageList">
                        <!-- 动态生成的图片缩略图 -->
                    </div>
                </div>
            </aside>

            <!-- 中央预览区 -->
            <section class="preview-area">
                <div class="canvas-container" id="canvasContainer">
                    <div class="canvas-wrapper">
                        <canvas id="mainCanvas"></canvas>
                        <div class="canvas-overlay" id="canvasOverlay">
                            <!-- 自由布局时的拖拽层 -->
                        </div>
                    </div>
                    <div class="empty-state" id="emptyState">
                        <div class="empty-state-illustration">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <path d="M21 15l-5-5L5 21"/>
                            </svg>
                        </div>
                        <h2>开始创建你的拼图</h2>
                        <p>上传多张图片，选择布局模式，<br>轻松制作精美的图片拼接作品</p>
                        <button class="btn btn-primary btn-lg" id="btnUploadMain">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="17,8 12,3 7,8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            选择图片
                        </button>
                    </div>
                </div>
                <div class="zoom-controls">
                    <button class="zoom-btn" id="zoomOut" title="缩小">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35M8 11h6"/>
                        </svg>
                    </button>
                    <span class="zoom-level" id="zoomLevel">100%</span>
                    <button class="zoom-btn" id="zoomIn" title="放大">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/>
                        </svg>
                    </button>
                    <button class="zoom-btn" id="zoomFit" title="适应窗口">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
                        </svg>
                    </button>
                </div>
            </section>

            <!-- 右侧属性面板 -->
            <aside class="sidebar sidebar-right">
                <div class="sidebar-section">
                    <h3 class="section-title">图片编辑</h3>
                    <div class="edit-placeholder" id="editPlaceholder">
                        <div class="edit-placeholder-illustration">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M9 9h.01M15 9h.01M9 15h6"/>
                            </svg>
                        </div>
                        <h4>选择图片进行编辑</h4>
                        <p>点击左侧列表或画布中的图片，<br>即可在此调整效果</p>
                        <div class="global-settings">
                            <h5>画布信息</h5>
                            <div class="setting-row">
                                <span>画布尺寸</span>
                                <span id="canvasSizeInfo">800 × 800</span>
                            </div>
                            <div class="setting-row">
                                <span>图片数量</span>
                                <span id="imageCountInfo">0 张</span>
                            </div>
                            <div class="setting-row">
                                <span>布局模式</span>
                                <span id="layoutModeInfo">网格</span>
                            </div>
                        </div>
                    </div>
                    <div class="edit-panel" id="editPanel" style="display: none;">
                        <div class="selected-preview">
                            <img id="selectedPreview" src="" alt="选中图片">
                        </div>
                        <div class="edit-tools">
                            <button class="edit-btn" data-action="rotateLeft" title="左旋转90°">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M2.5 2v6h6M2.66 15.57a10 10 0 1 0 .57-8.38"/>
                                </svg>
                            </button>
                            <button class="edit-btn" data-action="rotateRight" title="右旋转90°">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38"/>
                                </svg>
                            </button>
                            <button class="edit-btn" data-action="flipH" title="水平翻转">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 3v18M16 7l4 5-4 5M8 7L4 12l4 5"/>
                                </svg>
                            </button>
                            <button class="edit-btn" data-action="flipV" title="垂直翻转">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 12h18M7 16l5 4 5-4M7 8l5-4 5 4"/>
                                </svg>
                            </button>
                            <button class="edit-btn" data-action="crop" title="裁剪">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M6.13 1L6 16a2 2 0 002 2h15"/>
                                    <path d="M1 6.13L16 6a2 2 0 012 2v15"/>
                                </svg>
                            </button>
                            <button class="edit-btn" data-action="delete" title="删除">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3,6 5,6 21,6"/>
                                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="section-title">缩放调整</h3>
                    <div class="control-group">
                        <label>图片缩放</label>
                        <div class="range-control">
                            <input type="range" id="imageScale" min="50" max="200" value="100" disabled>
                            <span class="range-value" id="scaleValue">100%</span>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="section-title">滤镜效果</h3>
                    <div class="filter-presets" id="filterPresets">
                        <button class="filter-btn active" data-filter="none">
                            <span class="filter-preview" id="filterPreviewNone">
                                <span class="filter-preview placeholder"></span>
                            </span>
                            <span>原图</span>
                        </button>
                        <button class="filter-btn" data-filter="grayscale">
                            <span class="filter-preview" id="filterPreviewGrayscale">
                                <span class="filter-preview placeholder grayscale"></span>
                            </span>
                            <span>黑白</span>
                        </button>
                        <button class="filter-btn" data-filter="sepia">
                            <span class="filter-preview" id="filterPreviewSepia">
                                <span class="filter-preview placeholder sepia"></span>
                            </span>
                            <span>复古</span>
                        </button>
                        <button class="filter-btn" data-filter="vintage">
                            <span class="filter-preview" id="filterPreviewVintage">
                                <span class="filter-preview placeholder vintage"></span>
                            </span>
                            <span>怀旧</span>
                        </button>
                        <button class="filter-btn" data-filter="cold">
                            <span class="filter-preview" id="filterPreviewCold">
                                <span class="filter-preview placeholder cold"></span>
                            </span>
                            <span>冷调</span>
                        </button>
                        <button class="filter-btn" data-filter="warm">
                            <span class="filter-preview" id="filterPreviewWarm">
                                <span class="filter-preview placeholder warm"></span>
                            </span>
                            <span>暖调</span>
                        </button>
                    </div>
                    <div class="control-group">
                        <label>亮度</label>
                        <div class="range-control">
                            <input type="range" id="brightness" min="0" max="200" value="100">
                            <span class="range-value" id="brightnessValue">100%</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>对比度</label>
                        <div class="range-control">
                            <input type="range" id="contrast" min="0" max="200" value="100">
                            <span class="range-value" id="contrastValue">100%</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>饱和度</label>
                        <div class="range-control">
                            <input type="range" id="saturation" min="0" max="200" value="100">
                            <span class="range-value" id="saturationValue">100%</span>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="section-title">文字水印</h3>
                    <div class="control-group">
                        <label>水印文字</label>
                        <input type="text" id="watermarkText" class="text-input" placeholder="输入水印内容...">
                    </div>
                    <div class="control-group">
                        <label>字体大小</label>
                        <div class="range-control">
                            <input type="range" id="watermarkSize" min="12" max="72" value="24">
                            <span class="range-value" id="watermarkSizeValue">24px</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>文字颜色</label>
                        <div class="color-picker-wrap">
                            <input type="color" id="watermarkColor" value="#1e293b">
                            <span class="color-value" id="watermarkColorValue">#1e293b</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>透明度</label>
                        <div class="range-control">
                            <input type="range" id="watermarkOpacity" min="10" max="100" value="50">
                            <span class="range-value" id="watermarkOpacityValue">50%</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>位置</label>
                        <div class="position-grid" id="watermarkPosition">
                            <button class="pos-btn" data-pos="top-left" title="左上">↖</button>
                            <button class="pos-btn" data-pos="top-center" title="上中">↑</button>
                            <button class="pos-btn" data-pos="top-right" title="右上">↗</button>
                            <button class="pos-btn" data-pos="center-left" title="左中">←</button>
                            <button class="pos-btn active" data-pos="center" title="居中">●</button>
                            <button class="pos-btn" data-pos="center-right" title="右中">→</button>
                            <button class="pos-btn" data-pos="bottom-left" title="左下">↙</button>
                            <button class="pos-btn" data-pos="bottom-center" title="下中">↓</button>
                            <button class="pos-btn" data-pos="bottom-right" title="右下">↘</button>
                        </div>
                    </div>
                </div>
            </aside>
        </main>

        <!-- 导出模态框 -->
        <div class="modal" id="exportModal">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>导出图片</h2>
                    <button class="modal-close" id="closeExportModal">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="export-preview">
                        <canvas id="exportPreviewCanvas"></canvas>
                    </div>
                    <div class="export-options">
                        <div class="control-group">
                            <label>导出格式</label>
                            <div class="format-btns">
                                <button class="format-btn active" data-format="png">PNG</button>
                                <button class="format-btn" data-format="jpeg">JPG</button>
                                <button class="format-btn" data-format="webp">WEBP</button>
                            </div>
                        </div>
                        <div class="control-group" id="qualityControl" style="display: none;">
                            <label>图片质量</label>
                            <div class="range-control">
                                <input type="range" id="exportQuality" min="10" max="100" value="90">
                                <span class="range-value" id="exportQualityValue">90%</span>
                            </div>
                        </div>
                        <div class="control-group">
                            <label>输出尺寸</label>
                            <div class="size-inputs">
                                <input type="number" id="exportWidth" class="size-input" placeholder="宽度">
                                <span class="size-separator">×</span>
                                <input type="number" id="exportHeight" class="size-input" placeholder="高度">
                                <button class="lock-btn active" id="lockRatio" title="锁定比例">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                                        <path d="M7 11V7a5 5 0 0110 0v4"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="export-info">
                            <span id="exportFileSize">预估大小: --</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-ghost" id="cancelExport">取消</button>
                    <button class="btn btn-primary" id="confirmExport">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                        下载图片
                    </button>
                </div>
            </div>
        </div>

        <!-- 裁剪模态框 -->
        <div class="modal" id="cropModal">
            <div class="modal-backdrop"></div>
            <div class="modal-content modal-large">
                <div class="modal-header">
                    <h2>裁剪图片</h2>
                    <button class="modal-close" id="closeCropModal">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="crop-container" id="cropContainer">
                        <img id="cropImage" src="" alt="裁剪预览">
                        <div class="crop-overlay" id="cropOverlay">
                            <div class="crop-box" id="cropBox">
                                <div class="crop-handle" data-handle="nw"></div>
                                <div class="crop-handle" data-handle="ne"></div>
                                <div class="crop-handle" data-handle="sw"></div>
                                <div class="crop-handle" data-handle="se"></div>
                                <div class="crop-handle" data-handle="n"></div>
                                <div class="crop-handle" data-handle="s"></div>
                                <div class="crop-handle" data-handle="w"></div>
                                <div class="crop-handle" data-handle="e"></div>
                            </div>
                        </div>
                    </div>
                    <div class="crop-presets">
                        <button class="crop-preset-btn active" data-ratio="free">自由</button>
                        <button class="crop-preset-btn" data-ratio="1:1">1:1</button>
                        <button class="crop-preset-btn" data-ratio="4:3">4:3</button>
                        <button class="crop-preset-btn" data-ratio="16:9">16:9</button>
                        <button class="crop-preset-btn" data-ratio="3:2">3:2</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-ghost" id="cancelCrop">取消</button>
                    <button class="btn btn-primary" id="confirmCrop">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20,6 9,17 4,12"/>
                        </svg>
                        应用裁剪
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast 提示 -->
        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="collage-js/imageManager.js"></script>
    <script src="collage-js/layoutEngine.js"></script>
    <script src="collage-js/editor.js"></script>
    <script src="collage-js/renderer.js"></script>
    <script src="collage-js/app.js"></script>
</body>
</html>
